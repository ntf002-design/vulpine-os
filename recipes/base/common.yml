---
# yaml-language-server: $schema=https://schema.blue-build.org/module-list-v1.json
modules:
  - type: signing
  - type: justfiles
    validate: true
    install: true
    include:
      - 30-secureboot.just
  - type: files
    files:
      - source: base
        destination: /
  - type: systemd
    system:
      masked:
        - rpm-ostreed-automatic.timer
      enabled:
        - bootc-fetch-apply-updates.timer
        - flatpak-system-updates.timer
    user:
      enabled:
        - flatpak-user-updates.timer

  # Install stuff from negativo
  - type: dnf
    repos:
      cleanup: true
      nonfree: negativo17
    replace:
      - from-repo: fedora-multimedia
        skip-unavailable: true
        exclude:
          - spotify
          - uld
          - rar
        packages:
          - libva
          - mesa-dri-drivers
          - mesa-filesystem
          - mesa-libEGL
          - mesa-libGL
          - mesa-libgbm
          - mesa-va-drivers
          - mesa-vulkan-drivers
          - libheif
    install: 
      packages:
        - repo: fedora-multimedia
          skip-unavailable: true
          packages:
            - intel-vaapi-driver
    replace:
      - from-repo: fedora-multimedia
        skip-unavailable: true
        packages:
          - libva-intel-media-driver
          - intel-gmmlib
          - intel-mediasdk
    install:
      packages:
        - libopenjph
        - repo: fedora-multimedia
          packages:
            - libva-utils
            - pipewire-libs-extra
            - heif-pixbuf-loader
    replace:
      - from-repo: fedora-multimedia
        packages:
          - old: ffmpeg-free
            new: ffmpeg
          - old: libfdk-aac-free
            new: libfdk-aac
          - old: libavcodec-free
            new: libavcodec
    install:
      packages:
        - repo: fedora-multimedia
          packages:
            - ffmpeg-libs
            #- steam
            

  ## x86_64 packages only, hence why skip-unavailable is set
  #- type: dnf
  #  install:
  #    packages:
  #      - repo: fedora-multimedia
  #        skip-unavailable: true
  #        packages:
  #          - intel-vaapi-driver
  #  replace:
  #    - from-repo: fedora-multimedia
  #      skip-unavailable: true
  #      packages:
  #        - libva-intel-media-driver
  #        - intel-gmmlib
  #        - intel-mediasdk
          
  #- type: dnf
  #  install:
  #    packages:
  #      - libopenjph # Manually install dependency for `libheif`, as Negativo upstreamed it
  #      - repo: fedora-multimedia
  #        packages:
  #          - libva-utils
  #          - pipewire-libs-extra
  #          - heif-pixbuf-loader
  #  replace:
  #    - from-repo: fedora-multimedia
  #      packages:
  #        - old: ffmpeg-free
  #          new: ffmpeg
  #        - old: libfdk-aac-free
  #          new: libfdk-aac
  #        - old: libavcodec-free
  #          new: libavcodec

  #- type: dnf
  #  install:
  #    packages:
  #      - repo: fedora-multimedia
  #        packages:
  #          - ffmpeg-libs

  # Install ublue and QOL stuff
  - type: dnf
    repos:
      cleanup: true
      copr:
        - ublue-os/packages
        - ublue-os/staging
    install:
      skip-unavailable: true
      packages:
      ## FILES, BOOTING, ROOT, STUFF
        - bootc #Swapping images
        - ublue-os-udev-rules #udev stuff for similar images
        - squashfs-tools #Squashfs read-only images? No idea what this is for but it seems loadbearing not touching it
        - fedora-repos-archive #repo definitions for older packages
        - just #Oh hey just is everywhere here
        - zstd #File compression
        - 7zip #File compression
        - sbsign #UEFI boot signing
        - apr #System portability layer
        - apr-util #Util for apr I'm assuming
        - fuse #Mounting
        - fuse-sshfs #Ssh mounting?
        - grub2-tools-extra #Extra grub debugging tools
        - openssl #cryptography tools (for whatever usage idk)
        - openssh-server #ssh
        - symlinks #symlinks
        - wireguard-tools #Utils for managing wireguard connections? (for whatever usage idk)
        - gvfs-fuse #GNOME file managing utilities, although not completely applicable to GNOME? :O Useful I guess
        - gvfs-smb
        - gvfs-nfs
        - gvfs-mtp
        - autoconf #For building things
        - automake #For building things (actually wait idk if I can built things if this is immutable hmmmm)
        - pkgconfig #Compiling helper
        - make #Building-compiling
        - qmake6
        - golang #All this building stuff is probs suited for a container rather than host system. After a while if I don't use these enough on host system I'll remove them (there's also stuff like rustup, gcc, clang, and others)
        - rclone #For mounting clouds
        #- dex-autostart #Manages .desktop files
      ## SHELL
        - zsh #Bash replacement shell
        - fzf #Command-line fuzzy finder
        - tmux #tmux
        - openssh-askpass #Password manager for ssh, def needed
        - btop #btop
        - nvtop #nvtop
        - htop #htop
        - wev #For sensing buttons pressed
        - evtest #Same thing
        - tcpdump #Displays network traffic via cli
        - net-tools #ifconfig, netstat, arp, etc
        - arp-scan
        - traceroute #Network diagnostics
        - lshw #Command line util for hardware status
        - smartmontools #Storage drive health tools
        - nvme-cli #Command line util for nvme drive status
        - micro #Basic text editor that isn't bloody Nano
        - fastfetch #Larp Larp Larp Sahur
      ## SOUND, AUDIO, MUSIC
        - alsa-firmware #Sound card firmware
        - pulseaudio-utils #pulse utils
        - ffmpegthumbnailer #lil thumbnail tool for ffmpeg to be used... probs never
        - vlc #VLC MY BELOVED
        - mpd #Music Player Daemon
        - ncmpcpp #Music Player CLI
        - fftw2 #for visualiser
        - fftw-devel #same
        - playerctl #Helps setting media keys
        - mpdris2 #Same
        - easyeffects #Microphone effects for replacing Logitech G Hub
        - lsp-plugins #Same
        - headsetcontrol
      ## VIDEO AND CAMERA
        - libcamera #Camera backend library
        - libcamera-tools
        - libcamera-gstreamer
        - libcamera-ipa
        - pipewire-plugin-libcamera #Connects libcamera with pipewire
      ## OTHER PERIPHERALS
        - libimobiledevice-utils #Utility to connect with Apple devices without Apple software
        - usbmuxd #Manages connections to things like iPhones and iPads via USB connection
        - libratbag-ratbagd #Gaming mouse utility backend - Replace Solaar
        - piper #GUI for libratbag
        - openrgb-udev-rules #Backend for openrgb (don't even have it lol)
        - pam-u2f #Want USB-based 2FA? This
        - pam_yubico #Older alternative to pam-u2f
        - pamu2fcfg #Backend
        - yubikey-manager #Manager software for pam_yubico?
      ## CONTAINERISATION
        - distrobox #CONTAINERISATION
        - flatpak-spawn #Allows for flatpak commands inside a sandbox
        - wine #alcohol
      ## NOT INCLUDED
        #- google-noto-sans-balinese-fonts 
        #- google-noto-sans-cjk-fonts
        #- google-noto-sans-javanese-fonts
        #- google-noto-sans-sundanese-fonts
        #- powerstat #Power consumption cli tool - Needed for laptops
        #- solaar-udev
      ## 
        - emacs-pgtk #To interface better with external things rather than a sandbox
        # PRODUCTIVITY - - - - - -
        # Things to install in Conda: R, Python (pip, pandas, matplotlib...), C++, GNU Octave (MATLAB replacement), GNU Plot, llama.cpp
        # THIS WILL BE DONE VIA A DISTROBOX
      exclude:
        - google-noto-sans-cjk-vf-fonts
        - default-fonts-cjk-sans
    remove:
      auto-remove: false
      packages:
        - fedora-flathub-remote
        - fedora-third-party
        - fedora-workstation-repositories
    replace:
      # mitigate upstream packaging bug: https://bugzilla.redhat.com/show_bug.cgi?id=2332429
      # swap the incorrectly installed OpenCL-ICD-Loader for ocl-icd, the expected package
      - from-repo: fedora
        install-weak-deps: false
        packages:
          - new: ocl-icd
            old: OpenCL-ICD-Loader

  - type: script
    env:
      CSFG: /usr/lib/systemd/system-generators/coreos-sulogin-force-generator
    snippets:
      # use CoreOS' generator for emergency/rescue boot
      # see detail: https://github.com/ublue-os/main/issues/653
      - curl -sSLo ${CSFG} https://raw.githubusercontent.com/coreos/fedora-coreos-config/refs/heads/stable/overlay.d/05core/usr/lib/systemd/system-generators/coreos-sulogin-force-generator
      - chmod +x ${CSFG}
      # Cleanup Negativo repo 
      - rm -f /etc/yum.repos.d/fedora-negativo17.repo
    scripts:
      - install-appimage-thumbnailer.sh
